    <style>
        @font-face {
            font-family: 'NCLNeovibes Demo';
            src: url('../assets/fonts/NCLNeovibes-Demo.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        .landing-nav .token-search { position: relative; width: 100%; max-width: none; margin: 0; min-width: 0; }
        .landing-nav .token-search input {
            width: 100%;
            height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border-default, rgba(255,255,255,0.12));
            background: var(--glass, rgba(255,255,255,0.04));
            color: inherit;
            font-family: inherit;
            font-size: 11px;
            outline: none;
            transition: border-color 120ms ease, background 120ms ease;
        }
        .landing-nav .token-search input:focus {
            border-color: rgba(var(--accent-rgb), 0.35);
            background: var(--surface-elevated, rgba(255,255,255,0.06));
        }
        .token-search-results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 60vh;
            overflow-y: auto;
            background: rgba(18,18,22,0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 6px;
            z-index: 1000;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        }
        .token-search-results[hidden] { display: none; }
        .search-result {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .search-result:hover { background: rgba(255,255,255,0.06); }
        .search-result img, .search-result .no-img {
            width: 28px; height: 28px; border-radius: 6px; object-fit: cover;
            background: rgba(255,255,255,0.06); flex: 0 0 28px;
        }
        .search-result .sr-symbol { font-weight: 600; font-size: 13px; }
        .search-result .sr-name { font-size: 12px; opacity: 0.7; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result .sr-mc { font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; }
        .search-result .sr-mint { font-size: 11px; opacity: 0.55; font-family: ui-monospace, Menlo, monospace; }
        .search-empty { padding: 14px; text-align: center; opacity: 0.6; font-size: 13px; }
        body.terminal-search-open { overflow: hidden; }
        body.terminal-search-open::after {
            content: ""; position: fixed; inset: 0; z-index: 1990;
            background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
        }
        body.terminal-search-open > .token-search {
            position: fixed; z-index: 2000; top: 8vh; left: 50%; right: auto;
            width: min(860px, calc(100vw - 32px)); min-width: min(860px, calc(100vw - 32px)); max-width: none;
            transform: translateX(-50%);
            border: 1px solid #252c36; border-radius: 16px;
            background: #0b0e13; box-shadow: 0 28px 80px rgba(0,0,0,.58);
            overflow: hidden;
        }
        body.terminal-search-open > .token-search input {
            width: 100%; height: 64px; box-sizing: border-box;
            border: 0; border-bottom: 1px solid #222934;
            border-radius: 0; padding: 0 56px 0 18px; background: #0b0e13;
            color: #f8fafc; font-size: 20px; font-weight: 500;
        }
        body.terminal-search-open > .token-search::after {
            content: "ESC"; position: absolute; right: 18px; top: 21px;
            padding: 4px 7px; border: 1px solid #303844; border-radius: 6px;
            color: #8d99aa; font: 700 9px/1 Inter,sans-serif; pointer-events: none;
        }
        body.terminal-search-open .token-search-results {
            position: static; display: block; width: auto; min-width: 0;
            max-height: min(68vh, 620px); min-height: 280px;
            padding: 0 14px 14px; border: 0; border-radius: 0;
            background: #0b0e13; box-shadow: none; backdrop-filter: none;
        }
        .search-discovery { padding: 14px 2px 10px; border-bottom: 1px solid #202630; }
        .search-discovery-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 9px; color: #7f8a99; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .06em;
        }
        .search-query-chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
        .search-query-chips::-webkit-scrollbar { display: none; }
        .search-query-chip {
            flex: 0 0 auto; border: 1px solid #252c36; border-radius: 999px;
            padding: 7px 11px; background: #12161d; color: #c6ced9;
            font: 650 11px/1 Inter,sans-serif; cursor: pointer;
        }
        .search-query-chip:hover { border-color: #465161; background: #181e27; }
        .search-results-label {
            display: flex; justify-content: space-between; padding: 11px 4px 7px;
            color: #778291; font-size: 10px; font-weight: 700; text-transform: uppercase;
        }
        .search-history-clear {
            border: 0; padding: 0; background: transparent; color: #7f8a99;
            font: 700 10px Inter,sans-serif; cursor: pointer;
        }
        .search-history-clear:hover { color: #f8fafc; }
        body.terminal-search-open .search-result {
            display: grid; grid-template-columns: 48px minmax(0,1fr) auto auto;
            gap: 11px; min-height: 66px; padding: 8px 10px; border-radius: 8px;
            border: 1px solid transparent; border-bottom-color: #1e242d;
        }
        body.terminal-search-open .search-result:hover {
            background: #121720; border-color: #313a47;
        }
        body.terminal-search-open .search-result img,
        body.terminal-search-open .search-result .no-img {
            width: 46px; height: 46px; border-radius: 10px; background: #171d25;
            border: 1px solid #313a47;
        }
        .sr-identity { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
        .sr-title { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
        body.terminal-search-open .search-result .sr-symbol { color: #f8fafc; font-size: 13px; font-weight: 800; }
        body.terminal-search-open .search-result .sr-name { color: #7f8a99; font-size: 11px; opacity: 1; }
        body.terminal-search-open .search-result .sr-mint { color: #5f6b7a; font-size: 9px; opacity: 1; }
        .sr-metric { min-width: 74px; display: grid; align-content: center; gap: 3px; text-align: right; }
        .sr-metric-label { color: #667181; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .sr-metric-value { color: #e5eaf0; font-size: 13px; font-weight: 800; }
        .sr-metric-value.is-mc { color: #facc15; }
        [data-theme="light"] body.terminal-search-open > .token-search,
        [data-theme="light"] body.terminal-search-open > .token-search input,
        [data-theme="light"] body.terminal-search-open .token-search-results { background: #f8fafc; color: #111827; }
        [data-theme="light"] body.terminal-search-open .search-result:hover { background: #edf2f7; }
        [data-theme="light"] body.terminal-search-open .search-result .sr-symbol { color: #111827; }
        [data-theme="light"] body.terminal-search-open > .token-search {
            border-color: #d6dde7; box-shadow: 0 28px 80px rgba(15,23,42,.22);
        }
        [data-theme="light"] body.terminal-search-open > .token-search input { border-bottom-color: #e0e6ee; }
        [data-theme="light"] body.terminal-search-open .search-result {
            border-bottom-color: #e2e7ee;
        }
        [data-theme="light"] body.terminal-search-open .search-result .sr-metric-value { color: #334155; }
        [data-theme="light"] .search-history-clear:hover { color: #111827; }
        [data-theme="light"] .search-query-chip { background: #edf2f7; color: #334155; border-color: #d3dbe5; }
        @media (max-width: 640px) {
            body.terminal-search-open > .token-search {

            body.terminal-search-open .search-result .no-img { width: 40px; height: 40px; }
            body.terminal-search-open .search-result .sr-volume { display: none; }

        .toast-stack {
            position: fixed;
            top: 50%;
            left: 50%;
            right: auto;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(360px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            overflow: hidden;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            background: rgba(20,20,24,0.96);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            min-width: 0;

            animation: toast-in 180ms ease-out;

        .toast.is-pos { border-color: rgba(74,222,128,0.4); }
        .toast.is-neg { border-color: rgba(248,113,113,0.4); }
        .toast.is-err { border-color: rgba(248,113,113,0.6); background: rgba(40,20,20,0.96); }
        @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function formatCompactNumber(value) {
                const num = Number(value);
                if (!Number.isFinite(num) || num <= 0) return 'N/A';
                if (num >= 1000000000) return `${(num / 1000000000).toFixed(1)}B`;
                if (num >= 1000000) return `${(num / 1000000).toFixed(1)}M`;
                if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
                return String(Math.round(num));
            }

            function parseCreatedMs(createdTimestamp) {
                if (typeof createdTimestamp === 'string' && createdTimestamp.trim()) {
                    const asNumber = Number(createdTimestamp);
                    if (Number.isFinite(asNumber)) {
                        createdTimestamp = asNumber;
                    } else {
                        const parsed = Date.parse(createdTimestamp);
                        return Number.isFinite(parsed) ? parsed : null;
                    }
                }

                let createdMs = Number(createdTimestamp);
                if (createdMs > 0 && createdMs < 1000000000000) {
                    createdMs *= 1000;
                }
                if (!Number.isFinite(createdMs) || createdMs <= 0) return null;
                return createdMs;
            }

            function formatAgeFromMs(createdMs) {
                if (!createdMs) return '--';
                const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
                const hours = Math.floor(diffSec / 3600);
                const minutes = Math.floor((diffSec % 3600) / 60);
                const seconds = diffSec % 60;

                if (hours > 0) {
                    return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
                }
                if (minutes > 0) {
                    return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
                }
                return `${seconds}s`;
            }

            function formatAge(createdTimestamp) {
                return formatAgeFromMs(parseCreatedMs(createdTimestamp));
            }

            function socialTagIcon(type) {

                    telegram: '<svg class="demo-tag-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.94 4.66a1.4 1.4 0 0 0-1.43-.22L3.07 11.34c-1.04.43-1.03 1.92.02 2.33l4.46 1.7 1.7 4.46c.4 1.05 1.9 1.06 2.33.02l6.9-17.44a1.4 1.4 0 0 0-.24-1.45zM9.4 14.6l7.52-7.1-5.9 8.2-.44-1.1z"/></svg>',

            function buildSocialTag(type, url, title) {
                const safeUrl = String(url || '').trim();
                if (!safeUrl) return '';
                let normalized = safeUrl;
                if (/^@[\w.]+$/i.test(normalized)) {
                    normalized = `https://x.com/${normalized.slice(1)}`;
                } else if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(normalized)) {
                    normalized = `https://${normalized}`;
                } else if (!/^https?:\/\//i.test(normalized)) {
                    return '';
                }
                const href = escapeHtml(normalized);
                const label = escapeHtml(title);
                const icon = socialTagIcon(type);
                return `<a class="demo-token-tag demo-token-tag--icon demo-token-tag--${type}" href="${href}" target="_blank" rel="noopener noreferrer" title="${label}" aria-label="${label}">${icon}</a>`;
            }

            function buildPumpTag(mint) {
                const href = escapeHtml(PUMP_COIN_URL(mint || ''));
                const icon = socialTagIcon('pump');

            }

            function buildTokenRowHtml(token) {
                const symbolRaw = String(token?.symbol || 'TICKER').replace(/\s+/g, '');
                const symbol = escapeHtml(symbolRaw.startsWith('$') ? symbolRaw : `$${symbolRaw}`);
                const symbolInitials = escapeHtml(symbolRaw.replace(/^\$/, '').slice(0, 2).toUpperCase() || '?');
                const name = escapeHtml(token?.name || 'tokenname');
                const mint = escapeHtml(token?.mint || '');
                const mcRaw = Number(token?.usd_market_cap || token?.market_cap || 0);
                const mcText = mcRaw > 0 ? `$${formatCompactNumber(mcRaw)}` : 'N/A';
                const volSource = Number(token?.volume_24h || token?.volume || token?.total_volume || 0);
                const volText = volSource > 0 ? `$${formatCompactNumber(volSource)}` : 'N/A';
                const iconUrl = token?.image_uri ? escapeHtml(ipfsToHttp(token.image_uri)) : '';
                const createdMs = parseCreatedMs(token?.created_timestamp);
                const ageText = escapeHtml(formatAgeFromMs(createdMs));
                const phase = escapeHtml(token?._phase || 'new');
                const imageFallbacks = imageCandidates(token?.image_uri).filter((url) => url !== iconUrl);
                const socialTags = [
                    buildSocialTag('x', token?.twitter, 'X (Twitter)'),
                    buildSocialTag('web', token?.website, 'Website'),
                    buildSocialTag('telegram', token?.telegram, 'Telegram'),
                    buildPumpTag(token?.mint || '')
                ].filter(Boolean).join('');
                const shortMint = mint ? `${mint.slice(0, 4)}..${mint.slice(-4)}` : '';
                const mintButton = mint
                    ? `<button class="demo-token-mint demo-token-copy" type="button" data-ca="${mint}" title="Copy contract address" aria-label="Copy ${symbol} contract address"><span class="demo-token-copy__label">${shortMint}</span><span class="demo-token-copy__icon" aria-hidden="true">⧉</span></button>`

                        <div class="demo-token-identity">
                            ${iconUrl
                                ? `<img class="demo-token-icon" src="${iconUrl}" data-fallbacks="${escapeHtml(imageFallbacks.join('|'))}" data-fallback-label="${symbolInitials}" alt="${symbol} logo" loading="lazy" referrerpolicy="no-referrer" onerror="retryTokenImage(this)" />`
                                : `<span class="demo-token-icon">${symbolInitials}</span>`

            function ipfsToHttp(uri) {
                if (!uri || typeof uri !== 'string') return '';
                const trimmed = uri.trim();
                if (!trimmed) return '';
                if (trimmed.startsWith('ipfs://')) {
                    const cid = trimmed.slice(7).replace(/^ipfs\//, '');
                    return `https://pump.mypinata.cloud/ipfs/${cid}`;
                }
                if (/^https?:\/\/ipfs\.io\/ipfs\//i.test(trimmed)) {
                    return trimmed.replace(/^https?:\/\/ipfs\.io\/ipfs\//i, 'https://pump.mypinata.cloud/ipfs/');
                }
                return trimmed;
            }

            function imageCandidates(uri) {
                const value = String(uri || '').trim();
                if (!value) return [];
                const match = value.match(/(?:ipfs:\/\/|\/ipfs\/)([^?#]+)/i);
                if (!match) return [value];
                const cidPath = match[1].replace(/^ipfs\//i, '');
                return [
                    `https://pump.mypinata.cloud/ipfs/${cidPath}`,
                    `https://cloudflare-ipfs.com/ipfs/${cidPath}`,
                    `https://ipfs.io/ipfs/${cidPath}`
                ];
            }

            window.retryTokenImage = function retryTokenImage(image) {
                const remaining = String(image?.dataset?.fallbacks || '').split('|').filter(Boolean);
                if (remaining.length) {
                    image.dataset.fallbacks = remaining.slice(1).join('|');
                    image.src = remaining[0];
                    return;
                }
                image.onerror = null;
                const placeholder = document.createElement('span');
                placeholder.className = 'demo-token-icon';
                placeholder.textContent = image.dataset.fallbackLabel || '?';
                image.replaceWith(placeholder);
            };

            async function refreshSolPrice() {
                for (const url of SOL_PRICE_URLS) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (!res.ok) continue;
                        const j = await res.json();
                        const price = Number(
                            j?.solana?.usd
                            ?? j?.data?.So11111111111111111111111111111111111111112?.price
                            ?? j?.price
                        );
                        if (Number.isFinite(price) && price > 0) {
                            solPriceUsd = price;
                            scheduleRender();
                            return;
                        }
                    } catch {
                        // try next
                    }
                }
            }

            function effectiveSolPriceUsd() {
                return (Number.isFinite(solPriceUsd) && solPriceUsd > 0) ? solPriceUsd : 170;
            }

            function computeUsdMc(token) {
                const mcSol = Number(token?.marketCapSol) || 0;
                const px = effectiveSolPriceUsd();
                return mcSol > 0 ? mcSol * px : 0;
            }

            /** Resolve USD MC for quick-buy when live/streaming data is briefly zero. */
            function resolveMcForQuickBuy(mint, snap) {
                const tok = tokenMap.get(mint);
                const px = effectiveSolPriceUsd();
                if (tok) {
                    const fromMap = computeUsdMc(tok);
                    if (fromMap > 0) return fromMap;
                    const mcSol = Number(tok.marketCapSol) || 0;
                    if (mcSol > 0) return mcSol * px;
                }
                const rowMc = Number(snap.mcUsd) || 0;
                return rowMc > 0 ? rowMc : 0;
            }

            function computeUsdVolume(token) {
                const volSol = Number(token?.volumeSol) || 0;
                const px = effectiveSolPriceUsd();
                return volSol > 0 ? volSol * px : 0;
            }

            function pruneTokens() {
                const nowMs = Date.now();
                const soonCutoff = nowMs - SOON_MAX_AGE_SECONDS * 1000;
                const migratedCutoff = nowMs - MIGRATED_MAX_AGE_SECONDS * 1000;
                for (const [mint, token] of tokenMap) {
                    if (!isPumpToken(token)) {
                        tokenMap.delete(mint);
                        unsubscribeTokenTrade(mint);
                        continue;
                    }
                    if (token.migrated) {
                        if (token.createdMs < migratedCutoff) {
                            tokenMap.delete(mint);
                            unsubscribeTokenTrade(mint);
                        }
                        continue;
                    }
                    if (token.createdMs < soonCutoff) {
                        tokenMap.delete(mint);
                        unsubscribeTokenTrade(mint);
                    }
                }
            }

            function toRenderPayload(token, mcUsd) {
                return {
                    mint: token.mint,
                    symbol: token.symbol,
                    name: token.name,
                    image_uri: token.image_uri,
                    usd_market_cap: mcUsd,
                    volume_24h: computeUsdVolume(token),
                    liquidity_usd: Number(token.liquidityUsd) || 0,
                    trade_count: Number(token.tradeCount) || 0,
                    bonding_progress: Number(token.bondingProgress) || Math.min(99, Math.max(0, (mcUsd / 69000) * 100)),
                    created_timestamp: token.createdMs,
                    twitter: token.twitter,
                    website: token.website,
                    telegram: token.telegram
                };
            }

            function getRenderableNewTokens() {
                const nowMs = Date.now();
                const out = [];
                for (const token of tokenMap.values()) {
                    if (token.migrated) continue;
                    if (!isPumpToken(token)) continue;
                    const ageSec = Math.max(0, Math.floor((nowMs - token.createdMs) / 1000));
                    if (ageSec > MAX_TOKEN_AGE_SECONDS) continue;
                    const mcUsd = computeUsdMc(token);
                    const liquidityUsd = Number(token.liquidityUsd) || 0;
                    if (Number.isFinite(mcUsd) && mcUsd >= MIN_MC_USD && mcUsd <= MAX_MC_USD) {
                        token.qualified = true;
                    }
                    if (!token.qualified) continue;
                    if (Number.isFinite(mcUsd) && mcUsd > 0 && mcUsd < DROP_MC_USD) continue;
                    const payload = toRenderPayload(token, mcUsd);
                    payload._phase = 'new';
                    out.push(payload);
                }
                out.sort((a, b) => b.created_timestamp - a.created_timestamp);
                return out.slice(0, MAX_VISIBLE_ROWS);
            }

            function getRenderableSoonTokens() {
                const out = [];
                for (const token of tokenMap.values()) {
                    if (token.migrated) continue;
                    if (!isPumpToken(token)) continue;
                    const mcUsd = computeUsdMc(token);
                    const liquidityUsd = Number(token.liquidityUsd) || 0;
                    if (!Number.isFinite(mcUsd) || mcUsd < MIN_SOON_MC_USD) continue;
                    const volUsd = computeUsdVolume(token);
                    if (!Number.isFinite(volUsd) || volUsd < MIN_SOON_VOL_USD) continue;
                    const payload = toRenderPayload(token, mcUsd);
                    payload._phase = 'soon';
                    out.push(payload);
                }
                out.sort((a, b) => b.usd_market_cap - a.usd_market_cap);
                return out.slice(0, MAX_VISIBLE_ROWS);
            }

            function getRenderableMigratedTokens() {
                const out = [];
                for (const token of tokenMap.values()) {
                    if (!token.migrated) continue;
                    if (!isPumpToken(token)) continue;
                    const migratedAt = Number(token.migratedAtMs) || 0;
                    if (!migratedAt) continue;
                    const mcUsd = computeUsdMc(token);
                    const liquidityUsd = Number(token.liquidityUsd) || 0;
                    if (!Number.isFinite(mcUsd) || mcUsd < MIN_MIGRATED_MC_USD) continue;
                    const volH24 = computeUsdVolume(token);
                    const volH1 = Number(token.volH1Usd) || 0;
                    const displayVol = volH24 || volH1 || 0;
                    if (displayVol < MIN_MIGRATED_VOL_USD) continue;
                    const payload = toRenderPayload(token, mcUsd);
                    payload._phase = 'migrated';
                    payload.volume_24h = displayVol;
                    payload.created_timestamp = migratedAt;
                    payload._migratedAtMs = migratedAt;
                    out.push(payload);
                }
                out.sort((a, b) => b._migratedAtMs - a._migratedAtMs);
                return out.slice(0, MAX_VISIBLE_ROWS);
            }

            function emptyRowHtml(message) {
                return `<article class="demo-token-row is-empty"><div class="demo-token-identity"><span class="demo-token-icon"></span></div><div class="demo-token-meta"><div class="empty-state"><span class="demo-token-name">${escapeHtml(message)}</span><button type="button" data-feed-retry>Retry</button></div><div class="demo-token-line2"><span class="demo-token-age">Feed filters may be hiding results</span></div></div></article>`;
            }

            function renderEmptyState(message) {
                if (newColumnList) newColumnList.innerHTML = emptyRowHtml(message);
                if (soonColumnList) soonColumnList.innerHTML = emptyRowHtml(message);
                if (migratedColumnList) migratedColumnList.innerHTML = emptyRowHtml(message);
            }

            function renderTokens() {
                pruneTokens();
                if (newColumnList) {
                    const tokens = getRenderableNewTokens();
                    if (!tokens.length) {
                        const msg = tokenMap.size === 0
                            ? 'Waiting for new tokens...'
                            : `Tracking ${tokenMap.size} tokens, none in $${(MIN_MC_USD/1000).toFixed(1)}K-$${(MAX_MC_USD/1000).toFixed(0)}K MC yet`;
                        newColumnList.innerHTML = emptyRowHtml(msg);
                    } else {
                        newColumnList.innerHTML = tokens.map(buildTokenRowHtml).join('');
                    }
                }
                if (soonColumnList) {
                    const tokens = getRenderableSoonTokens();
                    if (!tokens.length) {
                        const msg = tokenMap.size === 0
                            ? 'Waiting for pump.fun tokens...'
                            : `No tokens above $${(MIN_SOON_MC_USD/1000).toFixed(0)}K MC / $${(MIN_SOON_VOL_USD/1000).toFixed(0)}K vol yet`;
                        soonColumnList.innerHTML = emptyRowHtml(msg);
                    } else {
                        soonColumnList.innerHTML = tokens.map(buildTokenRowHtml).join('');
                    }
                }
                if (migratedColumnList) {
                    const tokens = getRenderableMigratedTokens();
                    if (!tokens.length) {
                        migratedColumnList.innerHTML = emptyRowHtml(`Waiting for bonded pump.fun tokens ≥ $${(MIN_MIGRATED_MC_USD/1000).toFixed(0)}K MC...`);
                    } else {
                        migratedColumnList.innerHTML = tokens.map(buildTokenRowHtml).join('');
                    }
                }
                tabColumns.forEach((column) => {
                    const count = document.querySelector(`[data-count-for="${column.dataset.tab}"]`);
                    if (count) count.textContent = String(column.querySelectorAll('.demo-token-row[data-mint]').length);
                });
            }

            function scheduleRender() {
                if (renderScheduled) return;
                renderScheduled = true;
                window.requestAnimationFrame(() => {
                    renderScheduled = false;
                    renderTokens();
                });
            }

            function tickAges() {
                const lists = [newColumnList, soonColumnList, migratedColumnList].filter(Boolean);
                let needsRerender = false;
                lists.forEach((list) => {
                    const rows = Array.from(list.querySelectorAll('.demo-token-row[data-created-ms]'));
                    rows.forEach((row) => {
                        const createdMs = Number(row.getAttribute('data-created-ms'));
                        if (!Number.isFinite(createdMs) || createdMs <= 0) return;
                        const ageSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
                        if (list === newColumnList && ageSec > MAX_TOKEN_AGE_SECONDS) {
                            needsRerender = true;
                            return;
                        }
                        const ageEl = row.querySelector('.demo-token-age');
                        if (ageEl) ageEl.textContent = formatAgeFromMs(createdMs);
                    });
                });
                if (needsRerender) scheduleRender();
            }

            async function fetchTokenMetadata(mint, uri) {
                if (!uri || metadataFetched.has(mint)) return;
                metadataFetched.add(mint);
                const candidates = imageCandidates(uri);
                for (const metadataUrl of candidates) {
                    try {
                        const res = await fetch(metadataUrl, { cache: 'no-store' });
                        if (!res.ok) continue;
                        const meta = await res.json();
                        const token = tokenMap.get(mint);
                        if (!token) return;
                        token.image_uri = ipfsToHttp(meta.image || meta.image_uri || meta.imageUrl || '');
                        token.twitter = meta.twitter || token.twitter;
                        token.website = meta.website || token.website;
                        token.telegram = meta.telegram || token.telegram;
                        metadataRetryCount.delete(mint);
                        scheduleRender();
                        return;
                    } catch {
                        // try the next IPFS gateway
                    }
                }
                metadataFetched.delete(mint);
                const retries = (metadataRetryCount.get(mint) || 0) + 1;
                metadataRetryCount.set(mint, retries);
                if (retries <= 3) window.setTimeout(() => fetchTokenMetadata(mint, uri), 8000 * retries);
            }

            function wsSend(payload) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return false;
                try {
                    ws.send(JSON.stringify(payload));
                    return true;
                } catch {
                    return false;
                }
            }

            function firstSocial(socials, type) {
                if (!Array.isArray(socials)) return '';
                const match = socials.find((s) => String(s?.type || '').toLowerCase() === type);
                return match?.url || '';
            }

            function ingestDexscreenerPair(p) {
                if (!p || p.chainId !== 'solana') return false;
                const mint = p.baseToken?.address;
                if (!mint) return false;
                const dexId = String(p.dexId || '').toLowerCase();
                const onPumpSwap = dexId === 'pumpswap' || dexId.startsWith('pumpswap');
                const onPumpFun = dexId === 'pumpfun' || dexId === 'pump' || dexId === 'pump-fun';
                const migrated = onPumpSwap;
                if (!onPumpFun && !migrated) return false;
                const createdAt = Number(p.pairCreatedAt) || Date.now();
                const mcUsd = Number(p.marketCap || p.fdv) || 0;
                const volUsd = Number(p?.volume?.h24 || p?.volume?.h1 || 0);
                const volH1Usd = Number(p?.volume?.h1 || 0);
                const volM5Usd = Number(p?.volume?.m5 || 0);
                const liquidityUsd = Number(p?.liquidity?.usd) || 0;
                const marketCapSol = solPriceUsd > 0 && mcUsd > 0 ? mcUsd / solPriceUsd : 0;
                const volumeSol = solPriceUsd > 0 && volUsd > 0 ? volUsd / solPriceUsd : 0;
                const info = p.info || {};
                const existing = tokenMap.get(mint);
                if (existing) {
                    if (migrated) {
                        if (!existing.migrated) existing.migratedAtMs = createdAt || Date.now();
                        else if (!existing.migratedAtMs) existing.migratedAtMs = createdAt || Date.now();
                        existing.migrated = true;
                    }
                    if (marketCapSol > 0) existing.marketCapSol = marketCapSol;
                    if (volumeSol > (existing.volumeSol || 0)) existing.volumeSol = volumeSol;
                    existing.volH1Usd = volH1Usd;
                    existing.volM5Usd = volM5Usd;
                    if (liquidityUsd > 0) existing.liquidityUsd = liquidityUsd;
                    existing.lastDexUpdateMs = Date.now();
                    if (!existing.image_uri && info.imageUrl) existing.image_uri = info.imageUrl;
                    if (!existing.twitter) existing.twitter = firstSocial(info.socials, 'twitter') || existing.twitter;
                    if (!existing.telegram) existing.telegram = firstSocial(info.socials, 'telegram') || existing.telegram;
                    if (!existing.website && Array.isArray(info.websites)) existing.website = info.websites[0]?.url || existing.website;
                    if (migrated) unsubscribeTokenTrade(mint);
                    return true;
                }
                tokenMap.set(mint, {
                    mint,
                    symbol: String(p.baseToken?.symbol || 'TKN').trim() || 'TKN',
                    name: String(p.baseToken?.name || 'unnamed').trim() || 'unnamed',
                    uri: '',
                    image_uri: info.imageUrl || '',
                    twitter: firstSocial(info.socials, 'twitter'),
                    website: Array.isArray(info.websites) ? (info.websites[0]?.url || '') : '',
                    telegram: firstSocial(info.socials, 'telegram'),
                    createdMs: createdAt,
                    marketCapSol,
                    volumeSol,
                    volH1Usd,
                    volM5Usd,
                    liquidityUsd,
                    lastDexUpdateMs: Date.now(),
                    qualified: mcUsd >= MIN_MC_USD && mcUsd <= MAX_MC_USD,
                    migrated,
                    migratedAtMs: migrated ? (createdAt || Date.now()) : 0,
                    launchpad: PUMP_LAUNCHPAD
                });
                if (!migrated) subscribeTokenTrade(mint);
                return true;
            }

            async function refreshTrackedMigratedFromDex() {
                const mints = [];
                for (const token of tokenMap.values()) {
                    if (token.migrated) mints.push(token.mint);
                }
                if (!mints.length) return;
                for (let i = 0; i < mints.length; i += 30) {
                    const batch = mints.slice(i, i + 30);
                    try {
                        const url = `https://api.dexscreener.com/tokens/v1/solana/${batch.join(',')}`;
                        const res = await fetch(url, { cache: 'no-store' });
                        if (!res.ok) continue;
                        const arr = await res.json();
                        if (!Array.isArray(arr)) continue;
                        for (const p of arr) ingestDexscreenerPair(p);
                    } catch {
                        // batch failed, continue
                    }
                }
                scheduleRender();
            }

            function pickPumpswapPool(pools) {
                if (!Array.isArray(pools) || !pools.length) return null;
                const pumpswap = pools.find((p) => /pumpswap/i.test(String(p?.market || p?.dex || p?.dexId || '')));
                if (pumpswap) return pumpswap;
                const sorted = [...pools].sort((a, b) => {
                    const ta = toMsTimestamp(a?.createdAt ?? a?.openTime ?? a?.lastUpdated);
                    const tb = toMsTimestamp(b?.createdAt ?? b?.openTime ?? b?.lastUpdated);
                    return tb - ta;
                });
                return sorted[0] || null;
            }

            function extractMigrationTimestamp(item, tok, pumpswapPool, poolForData) {
                const candidates = [
                    pumpswapPool?.createdAt,
                    pumpswapPool?.openTime,
                    pumpswapPool?.pairCreatedAt,
                    pumpswapPool?.poolCreatedAt,
                    pumpswapPool?.created_at,
                    poolForData?.createdAt,
                    poolForData?.openTime,
                    poolForData?.pairCreatedAt,
                    poolForData?.poolCreatedAt,
                    poolForData?.created_at,
                    item?.events?.graduated,
                    item?.graduatedAt,
                    item?.graduationTime,
                    item?.bondedAt,
                    item?.bondedTime,
                    item?.pumpswap?.createdAt,
                    item?.pumpswap?.graduatedAt,
                    tok?.graduatedAt,
                    tok?.bondedAt,
                    tok?.createdOn,
                    tok?.createdAt
                ];
                for (const c of candidates) {
                    const ms = toMsTimestamp(c);
                    if (ms > 0) return ms;
                }
                return 0;
            }

            function toMsTimestamp(raw) {
                const n = Number(raw);
                if (!Number.isFinite(n) || n <= 0) return 0;
                return n < 1e12 ? n * 1000 : n;
            }

            function ingestSolanaTrackerToken(item) {
                if (!item || typeof item !== 'object') return false;
                const tok = item.token || item;
                const mint = tok?.mint || tok?.address || item.mint || item.address;
                if (!mint) return false;
                const pools = Array.isArray(item.pools) ? item.pools : (Array.isArray(tok.pools) ? tok.pools : []);
                const pumpswapPool = pickPumpswapPool(pools);
                const firstPool = pools[0] || {};
                const poolForData = pumpswapPool || firstPool;
                const sourceMarket = pumpswapPool?.market || firstPool?.market || pumpswapPool?.dex || firstPool?.dex || tok.source || '';
                const launchpad = detectLaunchpadFromMarket(sourceMarket);
                const isPumpGraduate = launchpad === PUMP_LAUNCHPAD || Boolean(pumpswapPool) || /pump$/i.test(mint);
                if (!isPumpGraduate) return false;
                const migratedAtMs = extractMigrationTimestamp(item, tok, pumpswapPool, poolForData);
                if (!migratedAtMs) return false;
                const mcUsd = Number(
                    poolForData?.marketCap?.usd
                    ?? item?.marketCap?.usd
                    ?? item?.marketCap
                    ?? 0
                ) || 0;
                const marketCapSol = solPriceUsd > 0 && mcUsd > 0 ? mcUsd / solPriceUsd : 0;
                const volH24Usd = Number(
                    poolForData?.txns?.volume24h
                    ?? poolForData?.txns?.volume
                    ?? poolForData?.volume?.h24
                    ?? poolForData?.volume?.usd
                    ?? poolForData?.volume24h
                    ?? item?.volume?.h24
                    ?? item?.volume_24h
                    ?? 0
                ) || 0;
                const volH1Usd = Number(
                    poolForData?.txns?.volume1h
                    ?? poolForData?.volume?.h1
                    ?? item?.volume?.h1
                    ?? 0
                ) || 0;
                const volM5Usd = Number(
                    poolForData?.txns?.volume5m
                    ?? poolForData?.volume?.m5
                    ?? item?.volume?.m5
                    ?? 0
                ) || 0;
                const volumeSol = solPriceUsd > 0 && volH24Usd > 0 ? volH24Usd / solPriceUsd : 0;
                const liquidityUsd = Number(
                    poolForData?.liquidity?.usd
                    ?? poolForData?.liquidity
                    ?? item?.liquidity?.usd
                    ?? item?.liquidity
                    ?? 0
                ) || 0;
                const existing = tokenMap.get(mint);
                if (existing) {
                    existing.migrated = true;
                    if (!existing.migratedAtMs) existing.migratedAtMs = migratedAtMs;
                    if (marketCapSol > 0) existing.marketCapSol = marketCapSol;
                    if (volumeSol > (existing.volumeSol || 0)) existing.volumeSol = volumeSol;
                    if (volH1Usd > 0) existing.volH1Usd = volH1Usd;
                    if (volM5Usd > 0) existing.volM5Usd = volM5Usd;
                    if (liquidityUsd > 0) existing.liquidityUsd = liquidityUsd;
                    if (!existing.image_uri && (tok.image || tok.image_uri)) existing.image_uri = tok.image || tok.image_uri;
                    if (!existing.twitter && tok.twitter) existing.twitter = tok.twitter;
                    if (!existing.website && tok.website) existing.website = tok.website;
                    if (!existing.telegram && tok.telegram) existing.telegram = tok.telegram;
                    if (!existing.launchpad) existing.launchpad = PUMP_LAUNCHPAD;
                    existing.lastDexUpdateMs = Date.now();
                    unsubscribeTokenTrade(mint);
                    return true;
                }
                tokenMap.set(mint, {
                    mint,
                    symbol: String(tok.symbol || 'TKN').trim() || 'TKN',
                    name: String(tok.name || 'unnamed').trim() || 'unnamed',
                    uri: tok.uri || '',
                    image_uri: tok.image || tok.image_uri || '',
                    twitter: tok.twitter || '',
                    website: tok.website || '',
                    telegram: tok.telegram || '',
                    createdMs: toMsTimestamp(tok.createdOn || tok.createdAt) || migratedAtMs,
                    marketCapSol,
                    volumeSol,
                    volH1Usd,
                    volM5Usd,
                    liquidityUsd,
                    lastDexUpdateMs: Date.now(),
                    qualified: false,
                    migrated: true,
                    migratedAtMs,
                    launchpad: PUMP_LAUNCHPAD
                });
                return true;
            }

            let solanaTrackerSampleLogged = false;
            const ST_PUMP_MARKETS = ['pumpfun', 'pump.fun'];

            function extractListFromStResponse(data) {
                return Array.isArray(data)
                    ? data
                    : Array.isArray(data?.data) ? data.data
                    : Array.isArray(data?.tokens) ? data.tokens
                    : Array.isArray(data?.results) ? data.results
                    : [];
            }

            async function fetchGraduatedFromSolanaTracker() {
                if (!getSolanaTrackerKey() && typeof window.refreshPaperSecrets === 'function') {
                    await window.refreshPaperSecrets();
                }
                const key = getSolanaTrackerKey();
                if (!key) return;
                // Pump.fun graduated tokens only
                const urls = [
                    ...ST_PUMP_MARKETS.map((market) =>
                        `https://data.solanatracker.io/tokens/multi/graduated?limit=100&markets=${encodeURIComponent(market)}`
                    ),
                    ...SOLANA_TRACKER_GRADUATED_URLS
                ];
                let totalChanged = 0;
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { cache: 'no-store', headers: { 'x-api-key': key } });
                        if (!res.ok) continue;
                        const data = await res.json();
                        const list = extractListFromStResponse(data);
                        if (!list.length) continue;
                        if (!solanaTrackerSampleLogged) {
                            solanaTrackerSampleLogged = true;
                            console.log('[SolanaTracker graduated sample]', url, list[0]);
                        }
                        for (const item of list) {
                            if (ingestSolanaTrackerToken(item)) totalChanged++;
                        }
                    } catch {
                        // try next
                    }
                }
                if (totalChanged) scheduleRender();
            }

            async function backfillRecentTokens() {
                const queries = ['pumpfun', 'pump.fun', 'pumpswap', 'pumpswap new', 'new pumpswap'];
                let changed = 0;
                for (const q of queries) {
                    try {
                        const url = `https://api.dexscreener.com/latest/dex/search?q=${encodeURIComponent(q)}`;
                        const res = await fetch(url, { cache: 'no-store' });
                        if (!res.ok) continue;
                        const j = await res.json();
                        const pairs = Array.isArray(j?.pairs) ? j.pairs : [];
                        for (const p of pairs) {
                            if (ingestDexscreenerPair(p)) changed++;
                        }
                    } catch {
                        // try next query
                    }
                }
                await refreshTrackedMigratedFromDex();
                if (changed) scheduleRender();
            }

            function subscribeTokenTrade(mint) {
                if (!mint || subscribedMints.has(mint)) return;
                subscribedMints.add(mint);
                wsSend({ method: 'subscribeTokenTrade', keys: [mint] });
            }

            function unsubscribeTokenTrade(mint) {
                if (!mint || !subscribedMints.has(mint)) return;
                subscribedMints.delete(mint);
                wsSend({ method: 'unsubscribeTokenTrade', keys: [mint] });
            }

            function handleCreateEvent(data) {
                const mint = String(data.mint || '').trim();
                if (!mint) return;
                const now = Date.now();
                const existing = tokenMap.get(mint);
                if (existing) {
                    existing.marketCapSol = Number(data.marketCapSol) || existing.marketCapSol;
                    scheduleRender();
                    return;
                }
                tokenMap.set(mint, {
                    mint,
                    symbol: String(data.symbol || 'TKN').trim() || 'TKN',
                    name: String(data.name || 'unnamed').trim() || 'unnamed',
                    uri: data.uri || '',
                    image_uri: '',
                    twitter: '',
                    website: '',
                    telegram: '',
                    createdMs: now,
                    marketCapSol: Number(data.marketCapSol) || 0,
                    volumeSol: Number(data.solAmount) || 0,
                    tradeCount: 0,
                    launchpad: PUMP_LAUNCHPAD
                });
                subscribeTokenTrade(mint);
                if (data.uri) fetchTokenMetadata(mint, data.uri);
                scheduleRender();
            }

            function handleTradeEvent(data) {
                const mint = String(data.mint || '').trim();
                if (!mint) return;
                const token = tokenMap.get(mint);
                if (!token) return;
                const pool = String(data.pool || '').toLowerCase();
                if (pool.includes('pumpswap')) {
                    if (!token.migrated) {
                        token.migrated = true;
                        token.migratedAtMs = Date.now();
                        pollFreshMigration(mint, 0);
                    }
                    unsubscribeTokenTrade(mint);
                    scheduleRender();
                    return;
                }
                const mcSol = Number(data.marketCapSol);
                if (Number.isFinite(mcSol) && mcSol > 0) token.marketCapSol = mcSol;
                const solAmt = Number(data.solAmount);
                if (Number.isFinite(solAmt) && solAmt > 0) token.volumeSol = (token.volumeSol || 0) + solAmt;
                token.tradeCount = (Number(token.tradeCount) || 0) + 1;
                scheduleRender();
            }

            async function fetchSingleMintFromDex(mint) {
                try {
                    const url = `https://api.dexscreener.com/tokens/v1/solana/${mint}`;
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) return false;
                    const arr = await res.json();
                    if (!Array.isArray(arr) || !arr.length) return false;
                    let ingested = false;
                    for (const p of arr) {
                        if (ingestDexscreenerPair(p)) ingested = true;
                    }
                    scheduleRender();
                    return ingested;
                } catch {
                    return false;
                }
            }

            const pendingMigrationPolls = new Set();
            function pollFreshMigration(mint, attempt = 0) {
                if (!mint || pendingMigrationPolls.has(`${mint}:${attempt}`)) return;
                const key = `${mint}:${attempt}`;
                pendingMigrationPolls.add(key);
                const delay = attempt === 0 ? 3000 : 10000;
                window.setTimeout(async () => {
                    pendingMigrationPolls.delete(key);
                    const token = tokenMap.get(mint);
                    if (!token || !token.migrated) return;
                    const indexed = await fetchSingleMintFromDex(mint);
                    const refreshed = tokenMap.get(mint);
                    const haveData = indexed && refreshed && (Number(refreshed.volH1Usd) || 0) > 0;
                    if (!haveData && attempt < 18) pollFreshMigration(mint, attempt + 1);
                }, delay);
            }

            function handleMigrationEvent(data) {
                const mint = String(data?.mint || '').trim();
                if (!mint) return;
                const nowMs = Date.now();
                let token = tokenMap.get(mint);
                if (!token) {
                    tokenMap.set(mint, {
                        mint,
                        symbol: 'TKN',
                        name: 'unnamed',
                        uri: '',
                        image_uri: '',
                        twitter: '',
                        website: '',
                        telegram: '',
                        createdMs: nowMs,
                        marketCapSol: 0,
                        volumeSol: 0,
                        qualified: false,
                        migrated: true,
                        migratedAtMs: nowMs
                    });
                } else {
                    if (!token.migrated) token.migratedAtMs = nowMs;
                    else if (!token.migratedAtMs) token.migratedAtMs = nowMs;
                    token.migrated = true;
                }
                unsubscribeTokenTrade(mint);
                pollFreshMigration(mint, 0);
                scheduleRender();
            }

            function handleWsMessage(raw) {
                let data;
                try { data = JSON.parse(raw); } catch { return; }
                if (!data || typeof data !== 'object') return;
                if (data.message && !data.txType && !data.mint) return;
                lastFeedUpdateMs = Date.now();
                setFeedStatus('live', 'updated just now');
                const txType = data.txType;
                if (txType === 'create') handleCreateEvent(data);
                else if (txType === 'buy' || txType === 'sell') handleTradeEvent(data);
                else if (txType === 'migrate' || txType === 'migration' || data.migrated === true) handleMigrationEvent(data);
                else if (data.mint && data.pool) {
                    const pool = String(data.pool).toLowerCase();
                    if (pool.includes('pumpswap')) {
                        handleMigrationEvent(data);
                    }
                }
            }

            function connectWebSocket() {
                try {
                    ws = new WebSocket(PUMPPORTAL_WS_URL);
                } catch (err) {
                    scheduleReconnect();
                    return;
                }
                ws.addEventListener('open', () => {
                    wsReconnectAttempts = 0;
                    setFeedStatus('delayed', 'connected · waiting for an update');
                    wsSend({ method: 'subscribeNewToken' });
                    wsSend({ method: 'subscribeMigration' });
                    if (subscribedMints.size) {
                        wsSend({ method: 'subscribeTokenTrade', keys: Array.from(subscribedMints) });
                    }
                });
                ws.addEventListener('message', (evt) => handleWsMessage(evt.data));
                ws.addEventListener('close', () => {
                    if (suppressNextReconnect) {
                        suppressNextReconnect = false;
                        return;
                    }
                    setFeedStatus('disconnected', 'reconnecting automatically');
                    scheduleReconnect();
                });
                ws.addEventListener('error', () => {
                    try { ws.close(); } catch {}
                });
            }

            function scheduleReconnect() {
                if (wsReconnectTimer) return;
                const delay = Math.min(30000, 1000 * Math.pow(2, wsReconnectAttempts++));
                setFeedStatus('disconnected', `retrying in ${Math.ceil(delay / 1000)}s`);
                wsReconnectTimer = window.setTimeout(() => {
                    wsReconnectTimer = null;
                    connectWebSocket();
                }, delay);
            }

            function ensureEnoughRows() {
                const lists = Array.from(document.querySelectorAll('.demo-token-list'));
                const minRows = window.matchMedia('(max-width: 900px)').matches ? 8 : 12;
                lists.forEach((list) => {
                    const tab = list.closest('.demo-board-column')?.dataset.tab;
                    if (tab === 'new' || tab === 'soon' || tab === 'migrated') return;
                    const template = list.querySelector('.demo-token-row');
                    if (!template) return;
                    if (template.classList.contains('is-empty')) return;
                    while (list.children.length < minRows) {
                        list.appendChild(template.cloneNode(true));
                    }
                });
            }

            function normalizeCapBlocks() {
                const capBlocks = Array.from(document.querySelectorAll('.demo-token-cap'));
                capBlocks.forEach((capEl) => {
                    const existingMc = capEl.querySelector('.demo-cap-mc')?.textContent?.trim();
                    const existingVol = capEl.querySelector('.demo-cap-vol')?.textContent?.trim();
                    if (existingMc && existingVol) {
                        capEl.innerHTML = `<span class="demo-cap-vol">${escapeHtml(existingVol)}</span><span class="demo-cap-mc">${escapeHtml(existingMc)}</span>`;
                        return;
                    }
                    const raw = String(capEl.textContent || '').replace(/\s+/g, ' ').trim();
                    if (!raw) return;
                    const mcMatch = raw.match(/mc\s*([0-9]+k?)/i);
                    const vMatch = raw.match(/v\s*([0-9]+k?)/i);
                    const mcText = mcMatch ? `MC ${mcMatch[1].toUpperCase()}` : 'MC 8K';
                    const vText = vMatch ? `V ${vMatch[1].toUpperCase()}` : 'V 1K';
                    capEl.innerHTML = `<span class="demo-cap-vol">${vText}</span><span class="demo-cap-mc">${mcText}</span>`;
                });
            }

            ensureEnoughRows();
            normalizeCapBlocks();
            renderEmptyState('Connecting to live token feed...');
            refreshSolPrice().then(() => {
                backfillRecentTokens();
                fetchGraduatedFromSolanaTracker();
            });
            connectWebSocket();
            window.setInterval(refreshSolPrice, SOL_PRICE_REFRESH_MS);
            window.setInterval(backfillRecentTokens, 60 * 1000);
            window.setInterval(fetchGraduatedFromSolanaTracker, SOLANA_TRACKER_REFRESH_MS);
            window.setInterval(tickAges, AGE_REFRESH_MS);
            window.setInterval(scheduleRender, 5000);
            window.setInterval(() => {
                if (!lastFeedUpdateMs) return;
                const ageSeconds = Math.floor((Date.now() - lastFeedUpdateMs) / 1000);
                if (ageSeconds > 45) setFeedStatus('delayed', `last update ${ageSeconds}s ago`);
                else setFeedStatus('live', `updated ${ageSeconds || 0}s ago`);
            }, 5000);

            function retryFeed() {
                if (wsReconnectTimer) {
                    clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = null;
                }
                try {
                    if (ws && ws.readyState < WebSocket.CLOSING) {
                        suppressNextReconnect = true;
                        ws.close();
                    }
                } catch {}
                setFeedStatus('delayed', 'reconnecting now');
                connectWebSocket();
                refreshSolPrice().then(backfillRecentTokens);
            }
            feedRetryEl?.addEventListener('click', retryFeed);
            document.addEventListener('click', (event) => {
                if (event.target.closest('[data-feed-retry]')) retryFeed();
            });

            async function copyToClipboard(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                    const helper = document.createElement('textarea');
                    helper.value = text;
                    helper.style.position = 'fixed';
                    helper.style.opacity = '0';
                    document.body.appendChild(helper);
                    helper.focus();
                    helper.select();
                    const copied = document.execCommand('copy');
                    helper.remove();
                    return copied;
                } catch {
                    return false;
                }
            }

            const copyHandler = async (event) => {
                const copyButton = event.target.closest('.demo-token-copy');
                if (!copyButton) return;
                const ca = copyButton.getAttribute('data-ca') || '';
                if (!ca) return;
                const ok = await copyToClipboard(ca);
                if (ok) {
                    const label = copyButton.querySelector('.demo-token-copy__label');
                    const prevText = label ? label.textContent : copyButton.textContent;
                    if (label) label.textContent = 'Copied';
                    else copyButton.textContent = 'Copied';
                    copyButton.classList.add('is-copied');
                    window.setTimeout(() => {
                        if (label) label.textContent = prevText;
                        else copyButton.textContent = prevText;
                        copyButton.classList.remove('is-copied');
                    }, 900);
                }
            };
            newColumnList?.addEventListener('click', copyHandler);
            soonColumnList?.addEventListener('click', copyHandler);
            migratedColumnList?.addEventListener('click', copyHandler);

            const searchInput = document.getElementById('token-search-input');
            const searchResultsEl = document.getElementById('token-search-results');
            const searchHost = searchInput?.closest('.token-search') || null;
            const searchOriginalParent = searchHost?.parentNode || null;
            const searchOriginalNextSibling = searchHost?.nextSibling || null;
            const SEARCH_HISTORY_KEY = 'paper.terminal.searchHistory.v1';
            let searchDebounce = null;
            let searchSeq = 0;

            function loadSearchHistory() {
                try {
                    const rows = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
                    return Array.isArray(rows) ? rows.slice(0, 10) : [];
                } catch {
                    return [];
                }
            }

            function saveSearchHistoryItem(item) {
                if (!item?.token?.mint) return;
                const rows = loadSearchHistory().filter((row) => row?.token?.mint !== item.token.mint);
                rows.unshift(item);
                try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(rows.slice(0, 10))); } catch {}

            function openTerminalSearch() {
                if (!searchHost) return;
                if (searchHost.parentNode !== document.body) document.body.appendChild(searchHost);

            function closeTerminalSearch() {
                if (searchResultsEl) searchResultsEl.hidden = true;
                document.body.classList.remove('terminal-search-open');
                if (!searchHost || !searchOriginalParent || searchHost.parentNode === searchOriginalParent) return;
                if (searchOriginalNextSibling && searchOriginalNextSibling.parentNode === searchOriginalParent) {
                    searchOriginalParent.insertBefore(searchHost, searchOriginalNextSibling);
                } else {
                    searchOriginalParent.appendChild(searchHost);

            function isPumpFunToken(item) {
                const tok = item?.token || item;
                const mint = tok?.mint || tok?.address || item?.mint;
                if (!mint) return false;
                if (/pump$/i.test(mint)) return true;
                const pools = Array.isArray(item.pools) ? item.pools : [];
                return pools.some((p) => /pump/i.test(String(p?.market || p?.dex || p?.dexId || '')));
            }

            function renderSearchResults(list, mode = 'results') {

                    return;

                const html = list.slice(0, 15).map((item) => {

                    const pools = Array.isArray(item.pools) ? item.pools : [];

            function localSearchResults(query = '') {
                const needle = query.trim().toLowerCase();
                return Array.from(tokenMap.values())
                    .filter((token) => !needle || `${token.symbol || ''} ${token.name || ''} ${token.mint || ''}`.toLowerCase().includes(needle))
                    .sort((a, b) => computeUsdMc(b) - computeUsdMc(a))
                    .map((token) => ({
                        token: {

                            symbol: token.symbol,

                    }));

            async function publicPumpSearch(query) {
                const local = localSearchResults(query);
                try {
                    const response = await fetch(
                        `https://api.dexscreener.com/latest/dex/search?q=${encodeURIComponent(query)}`,
                        { cache: 'no-store', headers: { accept: 'application/json' } }
                    );
                    if (!response.ok) return local;
                    const payload = await response.json();
                    const pairs = Array.isArray(payload?.pairs) ? payload.pairs : [];
                    const seen = new Set(local.map((item) => item?.token?.mint).filter(Boolean));
                    const remote = [];
                    for (const pair of pairs) {
                        if (pair?.chainId !== 'solana') continue;
                        const dex = String(pair?.dexId || '').toLowerCase();
                        if (!dex.includes('pump')) continue;
                        const mint = String(pair?.baseToken?.address || '');
                        if (!mint || seen.has(mint)) continue;
                        seen.add(mint);
                        remote.push({
                            token: {
                                mint,
                                symbol: pair?.baseToken?.symbol || '?',
                                name: pair?.baseToken?.name || 'unnamed',
                                image: pair?.info?.imageUrl || '',
                                volume_24h: Number(pair?.volume?.h24) || 0
                            },
                            pools: [{
                                market: dex,
                                marketCap: { usd: Number(pair?.marketCap || pair?.fdv) || 0 },
                                volume: { usd: Number(pair?.volume?.h24) || 0 }
                            }]
                        });
                    }
                    return [...local, ...remote];
                } catch {
                    return local;
                }
            }

            async function runTokenSearch(query) {
                if (!searchResultsEl) return;
                const trimmed = query.trim();
                if (!trimmed) {
                    renderSearchResults(loadSearchHistory(), 'history');
                    return;

                if (!getSolanaTrackerKey()) {
                    if (typeof window.refreshPaperSecrets === 'function') {
                        await window.refreshPaperSecrets();

                    if (!getSolanaTrackerKey()) {
                        const seq = ++searchSeq;
                        searchResultsEl.innerHTML = '<div class="search-empty">Searching Pump.fun tokens…</div>';
                        searchResultsEl.hidden = false;
                        const results = await publicPumpSearch(trimmed);
                        if (seq !== searchSeq) return;
                        renderSearchResults(results);
                        return;
                    }
                }
                const seq = ++searchSeq;
                searchResultsEl.innerHTML = '<div class="search-empty">Searching...</div>';
                searchResultsEl.hidden = false;
                try {
                    const url = `https://data.solanatracker.io/search?query=${encodeURIComponent(trimmed)}&limit=30&showAllPools=false`;
                    const res = await fetch(url, {
                        cache: 'no-store',
                        headers: { 'x-api-key': getSolanaTrackerKey() }
                    });
                    if (seq !== searchSeq) return;
                    if (!res.ok) {
                        searchResultsEl.innerHTML = '<div class="search-empty">Search failed</div>';
                        return;
                    }
                    const data = await res.json();
                    const list = Array.isArray(data)
                        ? data
                        : Array.isArray(data?.data) ? data.data
                        : Array.isArray(data?.tokens) ? data.tokens
                        : Array.isArray(data?.results) ? data.results
                        : [];
                    const filtered = list.filter(isPumpFunToken);
                    if (seq !== searchSeq) return;
                    renderSearchResults(filtered);
                } catch {
                    if (seq !== searchSeq) return;
                    searchResultsEl.innerHTML = '<div class="search-empty">Search failed</div>';
                }
            }
