            window.addEventListener('resize', ensureEnoughRows);

            // ===== Virtual trading engine =====
            const WALLET_KEY = 'paper.demoWallet.v1';
            const WALLET_KEY_LEGACY = 'Paper.demoWallet.v1';
            const STARTING_SOL = 5;
            const MIN_OPEN_POSITION_SOL = 0.0005;

            function loadWallet() {
                try {
                    const raw = localStorage.getItem(WALLET_KEY) || localStorage.getItem(WALLET_KEY_LEGACY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && typeof parsed.balanceSol === 'number' && parsed.positions && typeof parsed.positions === 'object') {
                            return parsed;
                        }
                    }
                } catch {}
                return { balanceSol: STARTING_SOL, realizedPnlSol: 0, positions: {}, history: [] };
            }
            function saveWallet() {
                try { localStorage.setItem(WALLET_KEY, JSON.stringify(wallet)); } catch {}
                window.dispatchEvent(new CustomEvent('paper:wallet-updated'));
            }
            const wallet = loadWallet();

            function getTokenSnapshot(mint) {
                const t = tokenMap.get(mint);
                if (t) {
                    return {
                        mint,
                        symbol: t.symbol,
                        name: t.name,
                        image_uri: ipfsToHttp(t.image_uri || ''),
                        mcUsd: computeUsdMc(t),
                        volUsd: computeUsdVolume(t),
                        twitter: t.twitter, website: t.website, telegram: t.telegram
                    };
                }
                return null;
            }

            function computeUnrealizedPnl(pos, currentMcUsd) {
                if (!pos || !pos.entryMcUsd || pos.entryMcUsd <= 0) return 0;
                if (!Number.isFinite(currentMcUsd) || currentMcUsd <= 0) return 0;
                const ratio = currentMcUsd / pos.entryMcUsd;
                const currentValueSol = pos.investedSol * ratio;
                return currentValueSol - pos.investedSol;
            }

            function totalUnrealizedSol() {
                let total = 0;
                for (const mint of Object.keys(wallet.positions)) {
                    const pos = wallet.positions[mint];
                    const t = tokenMap.get(mint);
                    const currentMcUsd = t ? computeUsdMc(t) : pos.lastMcUsd || pos.entryMcUsd;
                    if (t) pos.lastMcUsd = currentMcUsd;
                    total += computeUnrealizedPnl(pos, currentMcUsd);
                }
                return total;
            }

            const WALLET_PNL_7D_MS = 7 * 24 * 60 * 60 * 1000;
            /** Realized PnL from sells in the last 7 days, plus buy/sell SOL volume in that window (for the share card). */
            function computeWalletPnl7d() {
                const cutoff = Date.now() - WALLET_PNL_7D_MS;
                let realized7d = 0;
                let buyVol7d = 0;
                let sellProceeds7d = 0;
                for (const h of wallet.history || []) {
                    const t = Number(h.at) || 0;
                    if (t < cutoff) continue;
                    if (h.kind === 'buy') buyVol7d += Number(h.sol) || 0;
                    if (h.kind === 'sell') {
                        sellProceeds7d += Number(h.sol) || 0;
                        if (Number.isFinite(h.pnlSol)) realized7d += h.pnlSol;
                    }
                }
                const pct = buyVol7d > 0 ? (realized7d / buyVol7d) * 100 : 0;
                return { realized7d, buyVol7d, sellProceeds7d, pct };
            }

            function fmtSol(n) {
                const v = Number(n) || 0;
                const sign = v >= 0 ? '+' : '';
                return `${sign}${v.toFixed(3)}`;
            }
            function fmtSolPlain(n) {
                return `${(Number(n) || 0).toFixed(3)} SOL`;
            }
            const PNL_HANDLE_KEY = 'paper.pnlHandle';
            const PNL_HANDLE_MAX = 10;
            function normalizePnlHandleInput(value) {
                return String(value || '')
                    .trim()
                    .replace(/^@+/g, '')
                    .slice(0, PNL_HANDLE_MAX);
            }
            function getPnlCardDisplayName() {
                const raw = localStorage.getItem(PNL_HANDLE_KEY);
                const h = normalizePnlHandleInput(raw);
                return h ? '@' + h : '';
            }
            function pnlHandleCandidate(value) {
                const raw = String(value || '').trim();
                if (!raw || raw.length > 24 || /[.â€¦…]/.test(raw)) return '';
                const h = normalizePnlHandleInput(raw);
                return /^[a-zA-Z0-9_]{2,10}$/.test(h) ? h : '';
            }
            function getWalletUsernameForPnlCard() {
                try {
                    const direct = pnlHandleCandidate(localStorage.getItem('paper.username'));
                    if (direct) return direct;
                } catch (e) {}
                try {
                    const session = JSON.parse(localStorage.getItem('paper.wallet.session') || 'null');
                    const fromSession = pnlHandleCandidate(session?.username || session?.displayName);
                    if (fromSession) return fromSession;
                } catch (e) {}
                try {
                    const fromAuth = pnlHandleCandidate(window.WalletAuth?.getDisplayName?.());
                    if (fromAuth) return fromAuth;
                } catch (e) {}
                return '';
            }
            function getWalletUserIdForPnlCard() {
                try {
                    const fromAuth = window.WalletAuth?.getUserId?.();
                    if (fromAuth) return fromAuth;
                } catch (e) {}
                try {
                    const session = JSON.parse(localStorage.getItem('paper.wallet.session') || 'null');
                    return session?.pubkey || null;
                } catch (e) {}
                return null;
            }
            function savePnlHandle(value) {
                const h = normalizePnlHandleInput(value);
                if (!h) return false;
                try { localStorage.setItem(PNL_HANDLE_KEY, h); } catch (e) {}
                return true;
            }
            function promptForPnlHandle() {
                return new Promise((resolve) => {
                    document.getElementById('pnl-handle-setup-modal')?.remove();
                    const modal = document.createElement('div');
                    modal.id = 'pnl-handle-setup-modal';
                    modal.className = 'pnl-card-modal pnl-handle-setup-modal';
                    modal.innerHTML = ''
                        + '<div class="pnl-card-backdrop"></div>'
                        + '<div class="pnl-card-dialog pnl-handle-dialog" role="dialog" aria-modal="true" aria-labelledby="pnl-handle-title">'
                        +   '<h2 class="pnl-handle-title" id="pnl-handle-title">What should we call you?</h2>'
                        +   '<p class="pnl-handle-hint">Pick a nickname for your cards. Max ' + PNL_HANDLE_MAX + ' characters.</p>'
                        +   '<input type="text" class="pnl-handle-input" maxlength="' + PNL_HANDLE_MAX + '" autocomplete="nickname" spellcheck="false" placeholder="e.g. bobo12" />'
                        +   '<div class="pnl-handle-actions">'
                        +     '<button type="button" class="pnl-card-btn" data-pnl-handle-cancel>Cancel</button>'
                        +     '<button type="button" class="pnl-card-btn is-primary" data-pnl-handle-save disabled>Continue</button>'
                        +   '</div>'
                        + '</div>';
                    document.body.appendChild(modal);
                    const input = modal.querySelector('.pnl-handle-input');
                    const saveBtn = modal.querySelector('[data-pnl-handle-save]');
                    const finish = (ok) => {
                        modal.remove();
                        resolve(ok);
                    };
                    const syncSave = () => {
                        saveBtn.disabled = normalizePnlHandleInput(input.value) === '';
                    };
                    input.addEventListener('input', syncSave);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !saveBtn.disabled) saveBtn.click();
                    });
                    modal.querySelector('[data-pnl-handle-cancel]').addEventListener('click', () => finish(false));
                    modal.querySelector('.pnl-card-backdrop').addEventListener('click', () => finish(false));
                    saveBtn.addEventListener('click', () => {
                        const v = normalizePnlHandleInput(input.value);
                        if (!v) return;
                        savePnlHandle(v);
                        finish(true);
                    });
                    (typeof queueMicrotask === 'function' ? queueMicrotask : (fn) => setTimeout(fn, 0))(() => {
                        input.focus();
                        syncSave();
                    });
                });
            }
            function ensurePnlHandleSet() {
                const raw = localStorage.getItem(PNL_HANDLE_KEY);
                if (raw !== null && normalizePnlHandleInput(raw) !== '') return Promise.resolve(true);
                if (savePnlHandle(getWalletUsernameForPnlCard())) return Promise.resolve(true);
                const userId = getWalletUserIdForPnlCard();
                if (userId && typeof getUserProfile === 'function') {
                    return getUserProfile(userId)
                        .then((profile) => savePnlHandle(profile?.username) ? true : promptForPnlHandle())
                        .catch(() => promptForPnlHandle());
                }
                return promptForPnlHandle();
            }

            const whBalEl = document.getElementById('wh-bal');

            function renderWalletHud() {
                if (whBalEl) whBalEl.textContent = fmtSolPlain(wallet.balanceSol);
                renderRowPositionMarkers();
                if (!positionsPanel.hidden) renderDemoPortfolio();
            }

            // Cache of DexScreener snapshots keyed by mint — used for positions/trades not in tokenMap
            const dexMintCache = new Map();
            async function fetchDexMintData(mints) {
                const missing = mints.filter((m) => m && !dexMintCache.has(m));
                if (!missing.length) return;
                try {
                    // DexScreener accepts comma-separated mints, up to 30 per call
                    const chunks = [];
                    for (let i = 0; i < missing.length; i += 30) chunks.push(missing.slice(i, i + 30));
                    for (const chunk of chunks) {
                        const url = 'https://api.dexscreener.com/latest/dex/tokens/' + chunk.join(',');
                        const res = await fetch(url, { cache: 'no-store', headers: { accept: 'application/json' } });
                        if (!res.ok) continue;
                        const body = await res.json();
                        const pairs = Array.isArray(body?.pairs) ? body.pairs : [];
                        chunk.forEach((mint) => {
                            const hit = pairs
                                .filter((p) => String(p?.baseToken?.address || '').toLowerCase() === mint.toLowerCase())
                                .sort((a, b) => (Number(b?.liquidity?.usd) || 0) - (Number(a?.liquidity?.usd) || 0))[0];
                            if (hit) {
                                dexMintCache.set(mint, {
                                    symbol: hit?.baseToken?.symbol || '',
                                    name: hit?.baseToken?.name || '',
                                    mcUsd: Number(hit?.marketCap || hit?.fdv) || 0,
                                    image: hit?.info?.imageUrl || '',
                                });
                            } else {
                                dexMintCache.set(mint, null);
                            }
                        });
                    }
                } catch {}
            }

            function pruneDustPositions() {
                let changed = false;
                for (const m of [...Object.keys(wallet.positions)]) {
                    const p = wallet.positions[m];
                    if (!p || Number(p.investedSol) < MIN_OPEN_POSITION_SOL) {
                        delete wallet.positions[m];
                        changed = true;
                    }
                }
                if (changed) saveWallet();
            }

            function updatePortfolioChart(pnlTotal, balance) {
                const lineEl = document.getElementById('portfolio-chart-line');
                const areaEl = document.getElementById('portfolio-chart-area');
                if (!lineEl || !areaEl) return;
                const w = 400;
                const h = 120;
                const pad = 8;
                const pts = [];
                const n = 24;
                const trend = pnlTotal >= 0 ? 1 : -1;
                const base = balance > 0 ? balance : 5;
                for (let i = 0; i < n; i++) {
                    const t = i / (n - 1);
                    const wave = Math.sin(i * 0.55) * 0.04;
                    const val = base * (0.88 + t * 0.12 * trend + wave);
                    const x = pad + t * (w - pad * 2);
                    const y = h - pad - ((val / (base * 1.05)) * (h - pad * 2));
                    pts.push([x, y]);
                }
                const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
                const area = line + ' L' + (w - pad) + ' ' + (h - pad) + ' L' + pad + ' ' + (h - pad) + ' Z';
                lineEl.setAttribute('d', line);
                areaEl.setAttribute('d', area);
            }

            function renderDemoPortfolio() {
                pruneDustPositions();
                const unreal = totalUnrealizedSol();
                const pnlTotal = wallet.realizedPnlSol + unreal;
                const balUsdEl = document.getElementById('portfolio-bal-usd');
                const balEl = document.getElementById('portfolio-bal-summary');
                const pnlEl = document.getElementById('portfolio-pnl-summary');
                const bal = Number(wallet.balanceSol) || 0;
                const spot = Number(solPriceUsd) > 0 ? solPriceUsd : 0;
                const usd = spot > 0 ? bal * spot : 0;
                if (balUsdEl) {
                    balUsdEl.textContent = usd > 0
                        ? ('$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
                        : '—';
                }
                if (balEl) balEl.textContent = bal.toFixed(6) + ' SOL';
                if (pnlEl) {
                    pnlEl.textContent = fmtSol(pnlTotal) + ' SOL';
                    pnlEl.classList.toggle('is-pos', pnlTotal > 0);
                    pnlEl.classList.toggle('is-neg', pnlTotal < 0);
                }
                const changePill = document.getElementById('portfolio-change-pill');
                if (changePill) {
                    const sign = pnlTotal >= 0 ? '+' : '';
                    changePill.textContent = sign + fmtSol(pnlTotal) + ' SOL';
                    changePill.classList.toggle('is-neg', pnlTotal < 0);

                const wins = closedSells.filter((h) => h.pnlSol > 0).length;
                const total = closedSells.length;
                const hitRate = total > 0 ? (wins / total) * 100 : 0;
                const hitEl = document.getElementById('portfolio-hitrate-summary');
                if (hitEl) {
                    hitEl.textContent = total > 0 ? (hitRate.toFixed(0) + '% (' + wins + '/' + total + ')') : '—';
                    hitEl.classList.toggle('is-pos', hitRate >= 50 && total > 0);

            function drawPnlCardText(ctx, text, x, y, maxWidth, font, align = 'left') {
                ctx.font = font;
                ctx.textAlign = align;
                const measured = ctx.measureText(text).width;
                const sizeMatch = font.match(/(\d+)px/);
                if (measured > maxWidth && sizeMatch) {
                    const baseSize = Number(sizeMatch[1]);
                    const nextSize = Math.max(34, Math.floor(baseSize * (maxWidth / measured)));
                    ctx.font = font.replace(/(\d+)px/, nextSize + 'px');
                }
                ctx.fillText(text, x, y);
            }
            async function buildPnlCardCanvas(targetMint) {
                const mint = targetMint;

                let holding = 0;
                let unreal = 0;
                if (pos && pos.entryMcUsd > 0) {
                    const mc = getMcUsdForMintForCard(mint);
                    const ratio = mc > 0 ? mc / pos.entryMcUsd : 1;
                    holding = pos.investedSol * ratio;
                    unreal = holding - pos.investedSol;
                }
                const pnl = realized + unreal;
                const pct = investedTotal > 0 ? (pnl / investedTotal) * 100 : 0;

            function playKachingTradeSound() {
                try {
                    if (!playKachingTradeSound._a) {
                        playKachingTradeSound._a = new Audio('../assets/audio/kaching-sound-fx.mp3');
                        playKachingTradeSound._a.preload = 'auto';

            function playTradeDenySound() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    const ctx = playTradeDenySound._ctx || (playTradeDenySound._ctx = new AC());
                    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                    const t0 = ctx.currentTime;
                    const o1 = ctx.createOscillator();
                    const g1 = ctx.createGain();
                    o1.type = 'triangle';
                    o1.frequency.setValueAtTime(420, t0);
                    o1.frequency.exponentialRampToValueAtTime(200, t0 + 0.12);
                    g1.gain.setValueAtTime(0.6, t0);
                    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
                    o1.connect(g1);
                    g1.connect(ctx.destination);
                    o1.start(t0);
                    o1.stop(t0 + 0.16);
                    const o2 = ctx.createOscillator();
                    const g2 = ctx.createGain();
                    o2.type = 'triangle';
                    o2.frequency.setValueAtTime(300, t0 + 0.14);
                    o2.frequency.exponentialRampToValueAtTime(140, t0 + 0.28);
                    g2.gain.setValueAtTime(0, t0);
                    g2.gain.setValueAtTime(0.5, t0 + 0.14);
                    g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.30);
                    o2.connect(g2);
                    g2.connect(ctx.destination);
                    o2.start(t0 + 0.14);
                    o2.stop(t0 + 0.32);
                } catch (_) {}
            }

            function executeBuy(mint, amountSol, mcUsdAtClick, snapshot) {
                if (!mint || !(amountSol > 0)) return false;
                if (amountSol > wallet.balanceSol + 1e-9) {
                    playTradeDenySound();
                    toast(`Insufficient balance (${fmtSolPlain(wallet.balanceSol)})`, 'is-err');
                    return false;
                }
                if (!(mcUsdAtClick > 0)) {
                    toast('No market cap available — can\'t price entry', 'is-err');
                    return false;
                }
                playKachingTradeSound();
                const existing = wallet.positions[mint];
                const snap = snapshot || getTokenSnapshot(mint) || {};
                if (existing) {
                    const totalInvested = existing.investedSol + amountSol;
                    const newRatio = totalInvested / ((existing.investedSol / existing.entryMcUsd) + (amountSol / mcUsdAtClick));
                    existing.entryMcUsd = newRatio;
                    existing.investedSol = totalInvested;
                    existing.lastMcUsd = mcUsdAtClick;
                    existing.symbol = snap.symbol || existing.symbol;
                    existing.name = snap.name || existing.name;
                    existing.image_uri = snap.image_uri || existing.image_uri;
                } else {
                    wallet.positions[mint] = {
                        mint,
                        symbol: snap.symbol || 'TKN',
                        name: snap.name || 'unnamed',
                        image_uri: snap.image_uri || '',
                        entryMcUsd: mcUsdAtClick,
                        investedSol: amountSol,
                        lastMcUsd: mcUsdAtClick,
                        openedAt: Date.now()
                    };
                }
                wallet.balanceSol -= amountSol;
                const nowMs = Date.now();
                wallet.history.unshift({
                    kind: 'buy',
                    mint,
                    symbol: snap.symbol || wallet.positions[mint]?.symbol || '',
                    name: snap.name || wallet.positions[mint]?.name || '',
                    image_uri: snap.image_uri || wallet.positions[mint]?.image_uri || '',
                    sol: amountSol,
                    mcUsd: mcUsdAtClick,
                    at: nowMs
                });
                if (wallet.history.length > 100) wallet.history.length = 100;
                saveWallet();
                renderWalletHud();
                toast(`Bought ${(snap.symbol || 'token').replace(/^\$?/, '$')} for ${amountSol.toFixed(3)} SOL @ MC $${formatCompactNumber(mcUsdAtClick)}`, 'is-pos');
                return true;
            }

            function executeSell(mint, fractionOfPosition, currentMcUsd) {
                const pos = wallet.positions[mint];
                if (!pos) { playTradeDenySound(); toast('No position to sell', 'is-err'); return false; }
                if (!(currentMcUsd > 0)) { toast('No live MC — can\'t close', 'is-err'); return false; }
                const f = Math.max(0, Math.min(1, Number(fractionOfPosition) || 0));
                if (f <= 0) return false;
                const sellInvested = pos.investedSol * f;
                const ratio = currentMcUsd / pos.entryMcUsd;
                const proceedsSol = sellInvested * ratio;
                const realized = proceedsSol - sellInvested;
                wallet.balanceSol += proceedsSol;
                wallet.realizedPnlSol += realized;
                pos.investedSol -= sellInvested;
                pos.lastMcUsd = currentMcUsd;
                const nowMs = Date.now();
                wallet.history.unshift({
                    kind: 'sell',
                    mint,
                    symbol: pos.symbol || '',
                    name: pos.name || '',
                    image_uri: pos.image_uri || '',
                    sol: proceedsSol,
                    pnlSol: realized,
                    mcUsd: currentMcUsd,
                    at: nowMs
                });
                if (wallet.history.length > 100) wallet.history.length = 100;
                if (pos.investedSol < MIN_OPEN_POSITION_SOL) delete wallet.positions[mint];
                saveWallet();
                renderWalletHud();
                const msg = `Sold ${(pos.symbol || 'token').replace(/^\$?/, '$')} → ${proceedsSol.toFixed(3)} SOL (PnL ${fmtSol(realized)})`;
                toast(msg, realized >= 0 ? 'is-pos' : 'is-neg');
                return true;
            }

            const whPositionsBtn = document.getElementById('wh-positions-btn');
            function closePortfolioPanel() {
                if (positionsPanel) positionsPanel.hidden = true;
                whPositionsBtn?.setAttribute('aria-expanded', 'false');
            }
            whPositionsBtn?.addEventListener('click', () => {
                if (!positionsPanel) return;
                positionsPanel.hidden = !positionsPanel.hidden;
                whPositionsBtn.setAttribute('aria-expanded', positionsPanel.hidden ? 'false' : 'true');
                if (!positionsPanel.hidden) renderDemoPortfolio();
            });
            document.getElementById('positions-close')?.addEventListener('click', closePortfolioPanel);
            document.getElementById('portfolio-modal-backdrop')?.addEventListener('click', closePortfolioPanel);

            let portfolioBalHidden = false;
            document.getElementById('portfolio-bal-toggle')?.addEventListener('click', () => {
                portfolioBalHidden = !portfolioBalHidden;
                ['portfolio-bal-usd', 'portfolio-bal-summary'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (portfolioBalHidden) {
                        el.dataset.prev = el.textContent;
                        el.textContent = '••••••';
                    } else if (el.dataset.prev) {
                        el.textContent = el.dataset.prev;
                    }
                });
            });
            document.querySelectorAll('.portfolio-time-tab').forEach((tab) => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.portfolio-time-tab').forEach((t) => t.classList.remove('is-active'));
                    tab.classList.add('is-active');
                });
            });

            document.getElementById('portfolio-share-7d-btn')?.addEventListener('click', async () => {
                try {
                    if (!(await ensurePnlHandleSet())) return;
                    await loadPnlCardTemplate();
                    const canvas = await buildWallet7dPnlCardCanvas();
                    if (!canvas) return;
                    showPnlCardModal(canvas, 'wallet-7d-pnl');
                } catch (err) {
                    console.warn('[pnl-card] 7d wallet card failed', err);
                    toast('Could not load PnL template', 'is-err');
                }
            });

            function renderPositionsList() {
                if (!positionsListEl) return;
                const mints = Object.keys(wallet.positions).filter((m) => {
                    const p = wallet.positions[m];
                    return p && Number(p.investedSol) >= MIN_OPEN_POSITION_SOL;
                });
                if (!mints.length) { positionsListEl.innerHTML = '<div class="term-tx-empty" style="padding:14px;">No open positions</div>'; return; }
                positionsListEl.innerHTML = mints.map((mint) => {
                    const pos = wallet.positions[mint];
                    const t = tokenMap.get(mint);
                    const dex = dexMintCache.get(mint);
                    if (dex?.symbol && !pos.symbol) pos.symbol = dex.symbol;
                    if (dex?.name && !pos.name) pos.name = dex.name;
                    const liveMc = t ? computeUsdMc(t) : 0;
                    const dexMc = Number(dex?.mcUsd) || 0;
                    const lastMc = Number(pos.lastMcUsd) || 0;
                    const mc = liveMc > 0 ? liveMc : (dexMc > 0 ? dexMc : lastMc);
                    const entry = Number(pos.entryMcUsd) || 0;
                    const ratio = mc > 0 && entry > 0 ? mc / entry : 1;
                    const unreal = pos.investedSol * (ratio - 1);
                    const pct = (ratio - 1) * 100;
                    const cls = unreal >= 0 ? 'is-pos' : 'is-neg';
                    const sym = (pos.symbol || 'TKN').replace(/^\$?/, '$');
                    return `
                        <div class="position-item" data-open-mint="${escapeHtml(mint)}">
                            <span class="pi-sym">${escapeHtml(sym)}</span>
                            <span class="pi-pnl ${cls}">${fmtSol(unreal)} (${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%)</span>
                            <span class="pi-meta">${pos.investedSol.toFixed(3)} SOL · entry ${entry > 0 ? '$' + formatCompactNumber(entry) : '—'} · now ${mc > 0 ? '$' + formatCompactNumber(mc) : '—'}</span>
                        </div>
                    `;
                }).join('');
            }
            positionsListEl?.addEventListener('click', (e) => {
                const item = e.target.closest('[data-open-mint]');
                if (!item) return;
                const mint = item.getAttribute('data-open-mint');
                positionsPanel.hidden = true;
                if (wallet.positions[mint]) {
                    try {
                        sessionStorage.setItem('paper.pendingTerminalSnap', JSON.stringify({
                            mint,
                            symbol: wallet.positions[mint].symbol,
                            name: wallet.positions[mint].name,
                            image_uri: wallet.positions[mint].image_uri
                        }));
                    } catch {}
                }
                window.location.href = 'demo-trading-terminal.html?chartonly=1#' + encodeURIComponent(mint);
            });

            document.getElementById('wh-reset-btn')?.addEventListener('click', () => {
                if (!confirm('Reset virtual wallet to 5 SOL? This clears all positions and history.')) return;
                wallet.balanceSol = STARTING_SOL;
                wallet.realizedPnlSol = 0;
                wallet.positions = {};
                wallet.history = [];
                saveWallet();
                renderWalletHud();
                toast('Wallet reset to 5 SOL', 'is-pos');
            });

            pruneDustPositions();
            renderWalletHud();
        })();
    </script>
    <script src="../scripts/nav-back.js"></script>
    <script src="/scripts/vercel-analytics.js"></script>
</body>
</html>
