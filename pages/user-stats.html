<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="paper portfolio stats — balance, P&amp;L, and trade history from your paper wallet.">
    <title>paper - Portfolio</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="apple-touch-icon" href="../assets/icons/favicon.png">
    <script src="../scripts/theme.js"></script>
    <link rel="stylesheet" href="../styles/style.css?v=light-soul-2">
    <link rel="stylesheet" href="../styles/landing-premium.css?v=light-soul-1">
    <link rel="stylesheet" href="../styles/user-stats.css?v=light-soul-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="../scripts/data-utils.js"></script>
    <script src="../scripts/wallet-auth.js"></script>
    <script src="../scripts/wallet-logos.js"></script>
    <script src="../scripts/wallet-modal.js"></script>
    <script src="../scripts/wallet-nav.js"></script>
    <script src="../scripts/leaderboard-sync.js?v=1"></script>
</head>
<body class="page-dashboard page-user-stats">
    <header class="landing-header" id="landing-header">
        <nav class="landing-nav" aria-label="Main">
            <a href="/pages/dashboard" class="landing-nav__brand landing-nav__brand--back" data-nav-back aria-label="Back">
                <span class="landing-nav__back" aria-hidden="true">←</span>
                <img src="../assets/images/paper-nav-logo.png" alt="paper" class="landing-nav__logo">
            </a>
            <div class="landing-nav__actions">
                <button type="button" class="nav-connect-btn landing-nav__connect nav-metal-pill" id="nav-connect-btn"><span class="nav-metal-pill__label metal-shine-button__label">Connect Wallet</span></button>
                <button type="button" class="theme-toggle landing-nav__theme" aria-label="Switch theme" aria-pressed="false">
                    <span class="theme-toggle-icon" aria-hidden="true">&#9790;</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-shell ustat-shell fade-in-up">
            <header class="ustat-head">
                <div>
                    <h1>Portfolio</h1>
                    <p id="ustat-wallet-label">Paper wallet stats</p>
                </div>
                <a href="/pages/demo-trading" class="ustat-cta">Open paper board</a>
            </header>

            <div class="ustat-top-grid">
                <article class="ustat-panel ustat-balance" aria-label="Balance">
                    <div class="ustat-balance__head">
                        <h2 class="ustat-panel__title">Balance</h2>
                        <div class="ustat-pnl-period" role="tablist" aria-label="PnL period">
                            <button type="button" class="ustat-pnl-tab" data-period="1d" role="tab">1D</button>
                            <button type="button" class="ustat-pnl-tab is-active" data-period="7d" role="tab" aria-selected="true">7D</button>
                        </div>
                    </div>
                    <div class="ustat-balance__body">
                        <div class="ustat-balance__primary">
                            <div class="ustat-balance__total" id="ustat-total-value">—</div>
                            <div class="ustat-balance__stats">
                                <div class="ustat-kv">
                                    <span>Unrealized P&amp;L</span>
                                    <strong id="ustat-unrealized">—</strong>
                                </div>
                                <div class="ustat-kv">
                                    <span>Tradeable balance</span>
                                    <strong id="ustat-tradeable">—</strong>
                                </div>
                                <div class="ustat-kv ustat-kv--period">
                                    <span id="ustat-period-label">7-day P&amp;L</span>
                                    <strong id="ustat-period-pnl">—</strong>
                                </div>
                            </div>
                        </div>
                        <div class="ustat-balance__actions">
                            <button type="button" class="ustat-share-btn" id="ustat-share-pnl-btn" title="Generate a shareable PnL card">Share PnL card</button>
                        </div>
                    </div>
                </article>
            </div>

            <div class="ustat-bottom-grid">
                <article class="ustat-panel ustat-history" aria-label="Trade history">
                    <div class="ustat-tabs" role="tablist">
                        <button type="button" class="ustat-tab" data-tab="active" role="tab">Active Positions</button>
                        <button type="button" class="ustat-tab is-active" data-tab="history" role="tab" aria-selected="true">History</button>
                        <button type="button" class="ustat-tab" data-tab="top" role="tab">Best trades</button>
                    </div>
                    <div class="ustat-toolbar">
                        <input type="search" class="ustat-search" id="ustat-search" placeholder="Search by name or address" autocomplete="off">
                    </div>
                    <div class="ustat-table-wrap">
                        <table class="ustat-table">
                            <thead>
                                <tr>
                                    <th>Token</th>
                                    <th>Bought</th>
                                    <th>Sold</th>
                                    <th>P&amp;L</th>
                                    <th><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="ustat-table-body"></tbody>
                        </table>
                    </div>
                </article>

                <article class="ustat-panel ustat-activity" aria-label="Recent activity">
                    <h2 class="ustat-panel__title ustat-panel__title--inset">Activity</h2>
                    <div class="ustat-activity-list" id="ustat-activity-list"></div>
                </article>
            </div>
        </section>

        <div class="dash-dock-wrap fade-in-up delay-1" aria-label="Dashboard modules">
                <div class="dash-dock-orbit" aria-hidden="true"></div>
                <nav class="dash-dock" id="dashboard-dock" aria-label="Dashboard dock">
                    <a href="lycuem-course" class="dash-dock__item dash-dock__item--train" data-dock-title="Lessons" data-dock-desc="Open lessons">
                        <span class="dash-dock__tooltip">lessons</span>
                        <span class="dash-dock__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img">
                                <path d="M5 4.5h9.5A3.5 3.5 0 0 1 18 8v11.5H7.5A3.5 3.5 0 0 1 4 16V5.5a1 1 0 0 1 1-1Z"></path>
                                <path d="M8 8h6M8 11h5M8 14h4"></path>
                            </svg>
                        </span>
                    </a>
                    <a href="demo-trading" class="dash-dock__item dash-dock__item--demo" data-dock-title="Paper Trade" data-dock-desc="Practice paper trades">
                        <span class="dash-dock__tooltip">Paper Trade</span>
                        <span class="dash-dock__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img">
                                <path d="M4 17 9 12l4 4 7-9"></path>
                                <path d="M4 20h16M4 4v16"></path>
                            </svg>
                        </span>
                    </a>
                    <a href="paper-ai" class="dash-dock__item dash-dock__item--ai" data-dock-title="paper AI" data-dock-desc="Launch assistant">
                        <span class="dash-dock__tooltip">paper AI</span>
                        <span class="dash-dock__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img">
                                <path d="M12 2l1.4 4.8L18 8l-4.6 1.2L12 14l-1.4-4.8L6 8l4.6-1.2L12 2Z"></path>
                                <path d="M19 13l.7 2.3L22 16l-2.3.7L19 19l-.7-2.3L16 16l2.3-.7L19 13Z"></path>
                                <path d="M5 16l.5 1.7L7 18l-1.5.5L5 20l-.5-1.5L3 18l1.5-.5L5 16Z"></path>
                            </svg>
                        </span>
                    </a>
                    <a href="/pages/user-stats" class="dash-dock__item dash-dock__item--stats" data-dock-title="Profile" data-dock-desc="View your stats">
                        <span class="dash-dock__tooltip">Profile</span>
                        <span class="dash-dock__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M5 20a7 7 0 0 1 14 0"></path>
                            </svg>
                        </span>
                    </a>
                </nav>
            </div>
    </main>

    <script src="../scripts/interactive-dots.js?v=atmosphere-1"></script>
    <script src="../scripts/cursor-utils.js"></script>
    <script src="../scripts/dashboard.js"></script>
    <script src="../scripts/user-stats.js?v=2"></script>
    <script src="../scripts/nav-back.js"></script>
    <script src="/scripts/vercel-analytics.js"></script>
</body>
</html>
